[package]
name = "opennow-streamer-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Linux media backend for the OpenNOW native streamer"

[features]
default = ["vulkan"]
vaapi = ["dep:cros-codecs"]
vulkan = ["dep:ash", "dep:ash-window", "dep:raw-window-handle"]
ffmpeg = ["dep:ffmpeg-next"]
ffmpeg-bundled = [
    "ffmpeg",
    "dep:ffmpeg-sys-next",
    "ffmpeg-next/build",
    # `build-portable` is a feature of ffmpeg-sys-next, not of ffmpeg-next.
    # Naming ffmpeg-next here was invalid and survived only because cargo skips
    # full feature validation while the lockfile stays fresh: any manifest edit
    # re-resolved and failed the build. The effect while it was unapplied was
    # silent and worse than a compile error: ffmpeg-sys-next's build script
    # then tuned the bundled FFmpeg with -march=native instead of a portable
    # baseline.
    "ffmpeg-sys-next/build-portable",
    "ffmpeg-sys-next/build-nvdec",
    "ffmpeg-sys-next/build-vulkan",
    "ffmpeg-sys-next/build-vaapi",
    # DRM PRIME export. Zero-copy presentation hands VA-API and Vulkan Video
    # surfaces to the presenter as DMA-BUF objects, and FFmpeg only compiles
    # those paths (vaapi_map_to_drm, vulkan_map_to_drm) when libdrm is enabled.
    # The bundled build used to configure with --disable-libdrm, so the
    # DRM-PRIME pixel format still existed while every export path was compiled
    # out: the first decoded frame failed with "DMA-BUF export failed: Invalid
    # argument" while the capability probe still advertised the backend.
    "ffmpeg-sys-next/build-lib-drm",
]

[dependencies]
ash = { version = "0.38", optional = true }
ash-window = { version = "0.13", optional = true }
# This maintained fork zero-initializes libva extension fields, so it remains
# buildable when newer libva headers grow the VP9 parameter structures.
cros-codecs = { package = "cros-codecs-extended", version = "0.0.5-extended.2", features = ["vaapi"], optional = true }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "software-scaling", "non-exhaustive-enums"], optional = true }
ffmpeg-sys-next = { version = "9.0.0", default-features = false, optional = true }
libc = "0.2"
libloading = "0.8"
serde_json.workspace = true
raw-window-handle = { version = "0.6", optional = true }
thiserror = "2"

[dev-dependencies]
static_assertions = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
